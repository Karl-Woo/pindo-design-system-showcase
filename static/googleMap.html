<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Google Maps for 拼岛Pindo</title>
  <link rel="stylesheet" href="./style/googleMap.css" />
</head>

<body>
  <div class="loading loading--compact" id="loading">
    <div class="spinner"></div>
    <div>正在加载</div>
  </div>

  <!-- 长内容面板：所有错误 / 重试 / 长文案走这里 -->
  <div class="loading-panel" id="loadingPanel" style="display: none;"></div>

  <!-- 顶部导航栏 -->
  <div class="navbar-container">
    <div class="navbar-content">
      <div class="navbar-left">
        <div class="nav-title">地图找团</div>
      </div>
      <div class="navbar-right" onclick="createNewGroup()">
        <div class="create-icon"></div>
        <div class="create-text">创建新团</div>
      </div>
    </div>
  </div>

  <!-- Google地图容器 -->
  <div id="map"></div>

  <!-- 顶部搜索框和筛选按钮 -->
  <div class="search-filter-container">
    <div class="search-box">
      <div class="search-icon" onclick="handleSearchIconClick()"></div>
      <input type="text" class="search-input" placeholder="输入地址，查找附近拼团" id="searchInput" />
    </div>
    <div class="filter-btn" onclick="showFilter()">
      <div class="filter-icon"></div>
    </div>
  </div>

  <!-- 地址推荐下拉列表 -->
  <div class="search-suggestions" id="searchSuggestions" style="display: none;">
    <div class="suggestions-list" id="suggestionsList">
      <!-- 动态生成推荐项 -->
    </div>
  </div>

  <!-- 创建新团弹框 -->
  <div class="create-group-modal" id="createGroupModal">
    <div class="modal-mask"></div>
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">创建新团</span>
        <span class="modal-close" onclick="closeCreateGroupModal()">×</span>
      </div>
      <div class="modal-body">
        <p>创建新团，成为你所在地区的首位团长！</p>
        <p>
          每次拼团确认收货后，团长将获得该批次总运费的
          <span style="color: #cb1d45">3%</span> 作为奖励。
        </p>
        <p>
          当前团长名额采取申请制。点击下方按钮填写申请问卷，我们的小助手会尽快与你联系。
        </p>
      </div>
      <div class="modal-footer">
        <div class="modal-btn" onclick="applyCreateGroup()">一键申请</div>
      </div>
    </div>
  </div>

  <!-- 底部拼团信息卡片 -->
  <div class="group-info-card" id="groupInfoCard">
    <div class="group-content" id="groupCard" onclick="goToGroupDetail()">
      <div class="group-left">
        <div class="group-icon"></div>
      </div>
      <div class="group-right">
        <div class="group-right-top">
          <div class="group-row-1">
            <div class="group-title"></div>
            <div class="status-tag" style="display: none">
              <span class="status-text"></span>
            </div>
          </div>
          <div class="group-row-2">
            <div class="schedule-date">
              <img src="./images/index/calendar.png" alt="" />
              <span class="schedule-text"></span>
            </div>
            <div class="distance-info">
              <div class="distance-icon"></div>
              <div class="distance-text"></div>
            </div>
          </div>
          <div class="group-row-company">
            <div class="group-company"></div>
          </div>
          <div class="group-tags"></div>
        </div>
        <div class="group-right-bottom">
          <div class="group-progress">
            <div class="progress-bar-container">
              <div class="progress-bar"></div>
            </div>
            <span class="progress-current-weight"></span>
            <span class="progress-min-weight"></span>
          </div>
          <div class="group-row-action" style="display: none">
            <div class="action-btn">
              <span class="action-text"></span>
              <img class="action-arrow" src="./images/index/backWR.png" alt="" />
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="list-btn" onclick="goToList()">
      <div class="list-icon"></div>
      <div class="list-text">列表</div>
    </div>
  </div>

  <!-- 引入UniApp WebView通信JS - 必须在body底部，确保DOM加载完成 -->
  <script src="https://js.cdn.aliyun.dcloud.net.cn/dev/uni-app/uni.webview.1.5.2.js"></script>

  <script>
    // ========== 全局状态变量 ==========
    // 全局变量：标记uni.webview.js是否已加载
    let uniWebViewReady = false
    let mapInitialized = false
    let googleMapsAPILoaded = false
    let googleMapsScriptLoading = false

    // ========== 初始化与工具函数 ==========
    // 初始化安全区域和导航栏高度
    function initSafeArea () {
      // 获取状态栏高度
      const statusBarHeight = getStatusBarHeight()
      document.documentElement.style.setProperty(
        '--status-bar-height',
        `${statusBarHeight}px`,
      )

      // 计算总高度
      const navbarHeight = 44
      const totalHeight = statusBarHeight + navbarHeight
      document.documentElement.style.setProperty(
        '--total-navbar-height',
        `${totalHeight}px`,
      )
    }

    // 检查uni.webview.js是否加载成功
    function checkUniWebViewReady () {
      if (window.uni && window.uni.postMessage) {
        uniWebViewReady = true
        return true
      }
      return false
    }

    // 显示错误信息（页面内显示）
    function showError (message) {
      const loadingEl = document.getElementById('loading')
      const panelEl = document.getElementById('loadingPanel')
      if (loadingEl) loadingEl.style.display = 'none'
      if (panelEl) {
        panelEl.innerHTML = `
          <div class="panel-title" style="color: #FF6B6B;">加载失败</div>
          <div class="panel-msg">${message}</div>
        `
        panelEl.style.display = 'flex'
      }
    }

    // 显示错误模态框
    function showErrorModal (title, message, detail) {
      const loadingEl = document.getElementById('loading')
      const panelEl = document.getElementById('loadingPanel')
      if (loadingEl) loadingEl.style.display = 'none'
      if (panelEl) {
        const fullMsg = detail ? `${message}\n详情: ${detail}` : message
        panelEl.innerHTML = `
          <div class="panel-title">${title}</div>
          <div class="panel-msg">${fullMsg}</div>
        `
        panelEl.style.display = 'flex'
      }
    }

    // 从URL参数获取值（确保返回字符串或null）
    function getUrlParameter (name) {
      try {
        const query = window.location.search || ''
        // 某些环境下 window.location.search 可能返回对象（低概率），兜底转字符串
        const queryString =
          typeof query === 'string' ? query : String(query || '')
        const urlParams = new URLSearchParams(queryString)
        const value = urlParams.get(name)
        return value === null ? null : String(value)
      } catch (error) {
        // 静默忽略URL解析异常
        return null
      }
    }

    // 获取状态栏高度
    function getStatusBarHeight () {
      // 优先从URL参数获取（UniApp传递）
      const urlStatusBarHeight = getUrlParameter('statusBarHeight')

      if (urlStatusBarHeight !== null && urlStatusBarHeight !== '') {
        const height = parseInt(urlStatusBarHeight)
        if (!isNaN(height) && height > 0) {
          return height
        }
      }

      // 尝试从UniApp获取
      if (window.uni && window.uni.getSystemInfoSync) {
        try {
          const systemInfo = window.uni.getSystemInfoSync()
          if (systemInfo.statusBarHeight) {
            return systemInfo.statusBarHeight
          }
        } catch (e) {
          // 静默失败
        }
      }

      // 根据设备类型估算
      const ua = navigator.userAgent

      if (/iPhone|iPad|iPod/.test(ua)) {
        // iPhone X 及以上设备（刘海屏）
        if (window.screen.height >= 812) {
          return 44
        }
        return 20
      }

      // Android设备
      if (/Android/.test(ua)) {
        return 24
      }

      return 0
    }

    // 页面加载立即执行基础初始化
    initSafeArea()

    // 立即检查uni.webview.js是否已加载
    if (checkUniWebViewReady()) {
    } else {
    }

    // ========== 地图核心对象 ==========
    let map
    let markers = []      // 拼团标记点数组
    let geocoder = null   // 地理编码器
    let searchMarker = null  // 搜索位置标记（红色定位图标）
    let searchTimer = null  // 搜索防抖定时器
    let currentGroupId = null // 保存当前团ID
    let userLocationMarker = null // 用户位置标记（蓝色圆点）
    let GroupMarker = null // 自定义标记点类（会在initMap中赋值）
    let isFromSearch = false // 是否来自搜索地址（用于控制搜索后不自动显示卡片）

    // ========== 标记与卡片渲染 ==========
    function clearMarkers () {
      if (!markers.length) return
      markers.forEach((item) => {
        if (item.infoWindow) {
          item.infoWindow.close()
        }
        if (item.marker) {
          // 支持自定义OverlayView标记点和标准Marker
          if (item.marker.setMap) {
            item.marker.setMap(null)
          }
        }
      })
      markers.length = 0
    }

    // 解析并显示团数据
    // 根据团状态获取操作按钮文本
    function getActionText (status) {
      const statusConfig = {
        0: { actionText: null },
        1: { actionText: null },
        2: { actionText: null },
        3: { actionText: null },
        4: { actionText: '' },
        5: { actionText: '' },
        6: { actionText: '立即支付' },
      }
      return (statusConfig[status] && statusConfig[status].actionText) || ''
    }

    // 渲染底部团卡片
    function renderGroupCard (group) {
      const groupInfoCard = document.getElementById('groupInfoCard')
      const groupCard = document.getElementById('groupCard')

      // 确保groupInfoCard始终显示（因为list-btn需要一直显示）
      if (groupInfoCard) {
        groupInfoCard.style.display = 'block'
      }

      // 无数据时隐藏groupCard
      if (!group || !groupCard) {
        groupCard && groupCard.classList.add('hidden')
        return
      }

      currentGroupId = group.id || null
      groupCard.classList.remove('hidden')

      if (!groupCard) {
        return
      }

      const tagHtml = `
					<div class="group-tags" style="${group.transport_type || group.cargo_type ? 'display:flex' : 'display:none'}">
						${group.transport_type ? `<span class="tag">${group.transport_type}</span>` : ''}
						${group.cargo_type ? `<span class="tag">${group.cargo_type}</span>` : ''}
					</div>`

      // const hasProgress = (group.progress && group.status == 2) || group.status == -1;
      const progressPct =
        typeof group.progress?.percentage === 'number'
          ? `${group.progress.percentage}%`
          : group.progress?.percentage || '0%'

      const actionText = getActionText(group.status)

      groupCard.innerHTML = `
					<div class="group-left">
						<div class="group-icon">${group.image ? `<img src="${group.image}" />` : ''}</div>
					</div>
					<div class="group-right">
						<div class="group-right-top">
						<div class="group-row-1">
							<div class="group-title">${group.group_name || ''}</div>
							<div class="status-tag" style="${group.status_text ? 'display:inline-flex' : 'display:none'}">
								<span class="status-text">${group.status_text || ''}</span>
							</div>
						</div>
						<div class="group-row-2" style="${group.estimated_ship_date || group.distance ? 'display:flex' : 'display:none'}">
							<div class="schedule-date" style="${group.estimated_ship_date ? 'display:flex' : 'display:none'}">
								<img src="./images/index/calendar.png" alt="" />
								<span class="schedule-text">${group.estimated_ship_date || ''}</span>
							</div>
							<div class="distance-info">
								<div class="distance-icon"></div>
								<div class="distance-text">${group.distance || '0km'}</div>
							</div>
						</div>
						<div class="group-row-company" style="${group.company_name ? 'display:block' : 'display:none'}">
							<div class="group-company">${group.company_name || ''}</div>
						</div>
						${tagHtml}
						</div>
						<div class="group-right-bottom">
						<div class="group-progress">
							<div class="progress-bar-container">
								<div class="progress-bar" style="width:${progressPct};"></div>
							</div>
							<span class="progress-current-weight">${group.progress?.current_weight ?? ''}${group.progress ? 'kg' : ''}</span>
							<span class="progress-min-weight">${group.progress ? '/' + (group.progress.min_weight ?? '') + 'kg' : ''}</span>
						</div>
						<div class="group-row-action" style="${actionText ? 'display:flex' : 'display:none'}">
							<div class="action-btn">
								<span class="action-text">${actionText || ''}</span>
								<img class="action-arrow" src="./images/index/backWR.png" alt="" />
								</div>
							</div>
						</div>
					</div>
				`

      // 为团卡片增加明显的切换过渡动效
      groupCard.classList.remove('card-switch-anim')
      // 强制重绘以便每次切换都能重新触发动画
      // eslint-disable-next-line no-unused-expressions
      void groupCard.offsetWidth
      groupCard.classList.add('card-switch-anim')
    }

    // 从URL参数更新团卡片（初始化时使用）
    function updateGroupCard () {
      const groupDataParam = getUrlParameter('groupData')

      if (!groupDataParam) {
        // 隐藏团信息卡片，但保持groupInfoCard显示（因为list-btn需要一直显示）
        const groupCard = document.getElementById('groupCard')
        if (groupCard) groupCard.classList.add('hidden')
        return
      }
      try {
        const group = JSON.parse(decodeURIComponent(groupDataParam))
        renderGroupCard(group)
      } catch (error) {
        // 隐藏团信息卡片，但保持groupInfoCard显示
        const groupCard = document.getElementById('groupCard')
        if (groupCard) groupCard.classList.add('hidden')
      }
    }

    // 在页面加载后更新团卡片（初始URL数据）
    updateGroupCard()

    // 初始化地图标记点（从URL参数获取所有团数据）
    // 从URL参数获取团数据并缓存
    function initMapMarkers () {
      const groupsDataParam = getUrlParameter('groupsData')

      if (groupsDataParam) {
        try {
          const groups = JSON.parse(decodeURIComponent(groupsDataParam))

          if (Array.isArray(groups) && groups.length > 0) {
            // 在地图加载完成后调用 addMarkers
            // 这里先保存数据，在 initMap 完成后调用
            window.mapMarkersData = groups
          }
        } catch (error) { }
      } else {
      }
    }

    // 初始化地图标记点
    initMapMarkers()

    // Google Maps API 加载完成后的回调
    function initMap () {
      try {
        googleMapsAPILoaded = true

        if (mapInitialized) {
          return
        }

        // 检查google.maps对象是否可用
        if (!window.google || !window.google.maps) {
          const errorMsg =
            'Google Maps API 对象不可用\n\n虽然脚本已加载，但 google.maps 对象未初始化'
          showErrorModal(
            '地图初始化失败',
            errorMsg,
            'window.google存在: ' + !!window.google,
          )
          return
        }
      } catch (error) {
        const errorMsg = '地图初始化时发生错误\n\n错误信息：' + error.message
        showErrorModal('地图初始化错误', errorMsg, error.stack)
        return
      }
      // 确保CSS变量已完全更新后再初始化地图
      // 等待一个事件循环，确保initSafeArea()的CSS变量更新已完成
      requestAnimationFrame(function () {
        setTimeout(function () {
          doInitMap()
        }, 50)
      })
    }

    // 实际的地图初始化函数
    function doInitMap () {
      // 自定义标记点类（显示进度百分比）- 在initMap内定义确保google已加载
      GroupMarker = class extends google.maps.OverlayView {
        constructor(position, groupData) {
          super()
          this.position = position
          this.groupData = groupData
          this.div = null
          this.infoWindow = null
          // 记录内部元素，便于状态切换时更新样式
          this.circle = null
          this.percentText = null
          this.triangle = null
          this.redDot = null // 红色小圆点
          // 记录当前是否应为激活态（解决在 onAdd 之前调用 setActive 的情况）
          this.isActive = false
        }

        onAdd () {
          const panes = this.getPanes()
          // 使用 overlayMouseTarget 以确保触摸/点击事件可用，退回 markerLayer
          const targetPane = panes?.overlayMouseTarget || panes?.markerLayer
          if (targetPane) {
            targetPane.style.pointerEvents = 'auto'
          }

          // 创建标记容器
          this.div = document.createElement('div')
          this.div.className = 'group-marker'
          this.div.style.position = 'absolute'
          // this.div.style.cursor = 'pointer';
          this.div.style.width = '30px'
          this.div.style.height = '30px'
          this.div.style.display = 'flex'
          this.div.style.alignItems = 'center'
          this.div.style.justifyContent = 'center'
          // 基础位置与过渡动画
          this.div.style.transform = 'translate(-50%, -50%) scale(1)'
          this.div.style.transition =
            'transform 0.2s ease, box-shadow 0.2s ease'
          this.div.style.zIndex = '1000'
          this.div.style.pointerEvents = 'auto' // 确保可点击

          // 创建红色圆圈
          const circle = document.createElement('div')
          circle.style.width = '30px'
          circle.style.height = '30px'
          circle.style.borderRadius = '50%'
          // 默认状态：红色渐变圆
          circle.style.background =
            'linear-gradient(180deg, #FC7594 0%, #CB1D45 100%)'
          circle.style.border = '2px solid #FFFFFF'
          // 去掉阴影，避免在某些缩放下出现类似方形的半透明背景
          circle.style.display = 'flex'
          circle.style.flexDirection = 'column'
          circle.style.alignItems = 'center'
          circle.style.justifyContent = 'center'
          circle.style.position = 'absolute'
          circle.style.top = '0'
          circle.style.left = '0'
          circle.style.pointerEvents = 'none' // 防止圆内阻断点击

          // 创建百分比文本
          const percentage =
            this.groupData.progress && this.groupData.progress.percentage
              ? Math.round(this.groupData.progress.percentage)
              : 0
          const percentText = document.createElement('div')
          percentText.textContent = percentage + '%'
          percentText.style.color = '#FFFFFF'
          percentText.style.fontSize = '10px'
          percentText.style.fontWeight = '600'
          percentText.style.textAlign = 'center'
          percentText.style.zIndex = '1001'

          circle.appendChild(percentText)
          this.div.appendChild(circle)

          // 缓存引用，便于高亮时切换样式
          this.circle = circle
          this.percentText = percentText

          // 创建底部倒三角（初始化时就创建，默认白色）
          const triangle = document.createElement('div')
          triangle.style.position = 'absolute'
          triangle.style.bottom = '-5px'
          triangle.style.left = '50%'
          triangle.style.transform = 'translateX(-50%)'
          triangle.style.width = '0'
          triangle.style.height = '0'
          triangle.style.borderLeft = '6px solid transparent'
          triangle.style.borderRight = '6px solid transparent'
          triangle.style.borderTop = '6px solid #FFFFFF'
          triangle.style.pointerEvents = 'none'
          this.div.appendChild(triangle)
          this.triangle = triangle

          // 如果在onAdd之前已经被标记为激活（例如初次addMarkers时设为激活），这里需要补一次样式同步
          if (this.isActive) {
            this.setActive(true)
          }

          // 创建信息窗口
          this.infoWindow = new google.maps.InfoWindow({
            content: `
								<div class="marker-info">
									<strong>${this.groupData.group_name || ''}</strong><br>
									${this.groupData.transport_type || ''}${this.groupData.cargo_type || ''}
								</div>
							`,
            disableAutoPan: true,
          })

          // 点击事件
          const handleClick = (evt) => {
            evt.stopPropagation()
            evt.preventDefault()
            // 关闭其他信息窗口 & 清除其他标记的高亮
            markers.forEach((m) => {
              if (m.infoWindow) {
                m.infoWindow.close()
              }
              if (m.marker && typeof m.marker.setActive === 'function') {
                m.marker.setActive(false)
              }
            })

            // 打开当前信息窗口
            this.infoWindow.open(
              map,
              new google.maps.Marker({ position: this.position, map: null }),
            )

            // 高亮当前标记
            if (typeof this.setActive === 'function') {
              this.setActive(true)
            }

            // 发送消息给App
            sendMessageToApp({
              type: 'markerClick',
              markerId: this.groupData.id,
              group: this.groupData,
            })

            // 同步更新底部卡片为当前标记数据
            currentGroupId = this.groupData.id || null
            renderGroupCard(this.groupData)
          }

          // 同时监听 click / touchstart 提升移动端 WebView 触发率
          this.div.addEventListener('click', handleClick)
          this.div.addEventListener('touchstart', handleClick, {
            passive: false,
          })

          if (targetPane) {
            targetPane.appendChild(this.div)
          }
        }

        draw () {
          const projection = this.getProjection()
          const position = projection.fromLatLngToDivPixel(this.position)
          this.div.style.left = position.x + 'px'
          this.div.style.top = position.y + 'px'
        }

        onRemove () {
          if (this.div && this.div.parentElement) {
            this.div.parentElement.removeChild(this.div)
          }
          if (this.infoWindow) {
            this.infoWindow.close()
          }
        }

        // 标记高亮/还原
        setActive (isActive) {
          // 记录当前目标状态，方便在onAdd之后补充样式
          this.isActive = !!isActive
          // div 还没创建时（onAdd 之前），这里只保存状态，不做样式
          if (!this.div || !this.circle) return
          if (isActive) {
            // 外层放大到48px（40px * 1.2 = 48px）
            this.div.style.transform = 'translate(-50%, -50%) scale(1.5)'

    // 从URL获取用户位置并添加标记
    function addUserLocationMarker () {

      const userLngParam = getUrlParameter('userLng')

      const userLat = parseFloat(userLatParam)
      const userLng = parseFloat(userLngParam)

      if (
        isNaN(userLat) ||
        isNaN(userLng) ||
        userLat === 0 ||
        userLng === 0
      ) {
        return
      }

      addUserLocationMarkerAt(userLat, userLng)
    }

    // 在指定坐标添加用户位置标记（蓝色圆点）
    function addUserLocationMarkerAt (userLat, userLng) {
      if (
        !map ||
        isNaN(userLat) ||
        isNaN(userLng) ||
        userLat === 0 ||
        userLng === 0
      ) {
        return
      }

      // 移除旧的用户位置标记
      if (userLocationMarker) {
        userLocationMarker.setMap(null)
        userLocationMarker = null
      }

      // 使用蓝色圆形自定义图标标记（旧版本样式）
      // 创建蓝色圆点SVG图标
      const blueCircleIcon = {
        path: google.maps.SymbolPath.CIRCLE,
        fillColor: '#4285F4', // Google蓝色
        fillOpacity: 1,
        strokeColor: '#FFFFFF', // 白色边框
        strokeWeight: 3,
        scale: 8, // 圆点大小
      }

      userLocationMarker = new google.maps.Marker({
        position: new google.maps.LatLng(userLat, userLng),
        map: map,
        title: '我的位置',
        icon: blueCircleIcon,
        zIndex: 999, // 确保显示在其他标记之上
      })

      // 点击用户标记时的事件
      userLocationMarker.addListener('click', function () {
        sendMessageToApp({
          type: 'userLocationClick',
          lat: userLat,
          lng: userLng,
        })
      })
    }

    // 添加拼团标记点到地图
    function addMarkers (groupData) {
      if (!groupData || groupData.length === 0) {
        return
      }

      // 保存数据以便消息兜底查找
      window.mapMarkersData = groupData

      clearMarkers()

      // 预处理：统计每个经纬度位置的团数量
      const positionCount = {}
      groupData.forEach(group => {
        const key = `${group.latitude},${group.longitude}`
        positionCount[key] = (positionCount[key] || 0) + 1
      })

      // 为每个位置的团分配偏移索引
      const positionIndex = {}

      let firstActiveSet = false
      groupData.forEach((group, index) => {
        const latValue = group.latitude
        const lngValue = group.longitude
        const lat =
          typeof latValue === 'number' ? latValue : parseFloat(latValue)
        const lng =
          typeof lngValue === 'number' ? lngValue : parseFloat(lngValue)

        if (isNaN(lat) || isNaN(lng)) {
          return
        }

        // 计算偏移（解决同位置标记重叠问题）
        let offsetLat = 0
        let offsetLng = 0
        const key = `${group.latitude},${group.longitude}`
        const totalAtPosition = positionCount[key]

        if (totalAtPosition > 1) {
          // 同一位置有多个团，添加微小偏移分散显示
          if (!positionIndex[key]) {
            positionIndex[key] = 0
          }
          const currentIndex = positionIndex[key]
          positionIndex[key]++

          // 使用固定的微小偏移（约5-10米）
          // 经度偏移：约0.0001度 ≈ 10米
          // 纬度偏移：约0.0001度 ≈ 10米
          const offset = 0.0001
          // 圆形分布偏移
          const angle = (currentIndex / totalAtPosition) * 2 * Math.PI
          offsetLat = Math.sin(angle) * offset * (currentIndex + 1) * 0.5
          offsetLng = Math.cos(angle) * offset * (currentIndex + 1) * 0.5
        }

        // 使用自定义标记点（显示进度百分比）
        if (map && GroupMarker) {
          const groupMarker = new GroupMarker(
            new google.maps.LatLng(lat + offsetLat, lng + offsetLng),
            group,
          )
          groupMarker.setMap(map)

          const markerItem = {
            marker: groupMarker,
            infoWindow: groupMarker.getInfoWindow(),
            data: group,
          }
          markers.push(markerItem)

          // 默认第一枚有效标记为激活状态（初始进入时就高亮）
          if (
            !firstActiveSet &&
            typeof groupMarker.setActive === 'function'
          ) {
            groupMarker.setActive(true)
            currentGroupId = group.id || null
            firstActiveSet = true
          }
        } else {
        }
      })
    }

    // 显示搜索结果地址标记（红色定位图标）+ 地址名称标签

      // 创建自定义地址标签（在图标下方显示）
      const AddressLabel = class extends google.maps.OverlayView {

        onAdd () {

            `

          if (targetPane) {
            targetPane.appendChild(this.div)
          }
        }

        draw () {
          const projection = this.getProjection()
          const position = projection.fromLatLngToDivPixel(this.position)
          // 标签紧贴图标底部尖端（anchor 点）

      // 创建并添加地址标签

      // 添加信息窗口（点击标记显示详情）

        content: `
            <div style="padding: 8px 12px; min-width: 150px;">
              <div style="font-weight: 600; color: #CB1D45; margin-bottom: 4px;">📍 搜索位置</div>
              <div style="font-size: 13px; color: #666;">${addressText || '当前搜索地址'}</div>
            </div>

      })

      // 点击标记显示信息窗口

      })

    // 获取附近团（按半径过滤，默认50km）
    function getNearbyGroups (centerLatLng, radiusMeters = 50000) {
      if (!window.mapMarkersData || !Array.isArray(window.mapMarkersData))
        return []
      if (
        !google.maps ||
        !google.maps.geometry ||
        !google.maps.geometry.spherical
      )
        return window.mapMarkersData
      return window.mapMarkersData.filter((g) => {
        const latValue = g.latitude
        const lngValue = g.longitude
        const lat =
          typeof latValue === 'number' ? latValue : parseFloat(latValue)
        const lng =
          typeof lngValue === 'number' ? lngValue : parseFloat(lngValue)
        if (isNaN(lat) || isNaN(lng)) return false
        const dist = google.maps.geometry.spherical.computeDistanceBetween(
          centerLatLng,
          new google.maps.LatLng(lat, lng),
        )
        return dist <= radiusMeters
      })
    }

    // ========== 地址搜索与推荐 ==========
    // 获取地址推荐列表（优先Autocomplete，失败则用Geocoder兜底）
    function fetchSuggestions (keyword) {
      // 最小 2 字才触发：避免 1 个字 / 误触就打 Autocomplete + Geocoding 计费接口
      if (!keyword || keyword.trim().length < 2) {
        hideSuggestions()
        return
      }

      // 方案1: 尝试使用 AutocompleteService（如果可用）
      if (window.autocompleteService) {
        // 简化请求参数，只传必需的 input
        const request = {
          input: keyword
        }

        // 如果地图已初始化，添加位置偏好
        if (map) {
          const center = map.getCenter()
          if (center) {
            request.location = new google.maps.LatLng(center.lat(), center.lng())
            request.radius = 50000
          }
        }
        try {
          window.autocompleteService.getPlacePredictions(request, function (predictions, status) {
            if (status === google.maps.places.PlacesServiceStatus.OK && predictions && predictions.length > 0) {
              showSuggestions(predictions)
            } else if (status === google.maps.places.PlacesServiceStatus.ZERO_RESULTS) {
              hideSuggestions()
            } else if (status === google.maps.places.PlacesServiceStatus.REQUEST_DENIED) {
              fetchSuggestionsWithGeocoder(keyword)
            } else {
              fetchSuggestionsWithGeocoder(keyword)
            }
          })

          // 设置超时兜底（如果 2 秒内没有响应，使用 Geocoder）
          setTimeout(function () {
            const container = document.getElementById('searchSuggestions')
            if (!container || container.style.display === 'none') {
              fetchSuggestionsWithGeocoder(keyword)
            }
          }, 2000)
        } catch (error) {
          fetchSuggestionsWithGeocoder(keyword)
        }
      } else {
        // 方案2: 直接使用 Geocoder
        fetchSuggestionsWithGeocoder(keyword)
      }
    }

    // 使用Geocoder获取地址推荐（Autocomplete失败时的兜底方案）
    function fetchSuggestionsWithGeocoder (keyword) {
      if (!geocoder) {
        hideSuggestions()
        return
      }

      // 构建多个搜索变体以获取更多结果
      const searchVariants = [
        keyword,                                    // 原始输入
        keyword + ', USA',                          // 添加国家
        keyword + ', United States',                // 添加完整国家名
      ]

      // 如果输入较短，添加更多变体
      if (keyword.length < 10) {
        searchVariants.push(keyword + ' Street')
        searchVariants.push(keyword + ' Avenue')
        searchVariants.push(keyword + ' Road')
      }

      let allResults = []
      let completedRequests = 0
      // 只发 1 次 geocode（原来每次 fallback 并发最多 3 次 = 3× Geocoding 计费，纯浪费）
      const totalRequests = 1

      // 并发发送多个请求以获取更多结果
      for (let i = 0; i < totalRequests; i++) {
        geocoder.geocode({ address: searchVariants[i] }, function (results, status) {
          completedRequests++

          if (status === google.maps.GeocoderStatus.OK && results && results.length > 0) {
            // 合并结果，去重（基于 place_id）
            results.forEach(function (result) {
              const exists = allResults.some(function (r) {
                return r.place_id === result.place_id
              })
              if (!exists) {
                allResults.push(result)
              }
            })
          }

          // 所有请求完成后，显示结果
          if (completedRequests === totalRequests) {
            if (allResults.length > 0) {
              // 转换为推荐格式（最多显示 8 条）
              const predictions = allResults.slice(0, 8).map(function (result) {
                const addressParts = result.formatted_address.split(',')
                return {
                  description: result.formatted_address,
                  place_id: result.place_id,
                  structured_formatting: {
                    main_text: addressParts[0].trim(),
                    secondary_text: addressParts.slice(1).join(',').trim()
                  },
                  geometry: result.geometry
                }
              })
              showSuggestions(predictions)
            } else {
              hideSuggestions()
            }
          }
        })
      }
    }

    // 渲染地址推荐下拉列表
    function showSuggestions (predictions) {
      const suggestionsContainer = document.getElementById('searchSuggestions')
      const suggestionsList = document.getElementById('suggestionsList')
      const searchInput = document.getElementById('searchInput')

      if (!suggestionsContainer || !suggestionsList) {
        // console.error('[showSuggestions] 容器元素未找到')
        return
      }

      // 【修复】检查输入框是否还有有效内容，如果已被清空则不显示列表
      if (!searchInput || !searchInput.value || !searchInput.value.trim()) {
        return
      }

      // 清空旧列表
      suggestionsList.innerHTML = ''

      // 生成推荐项
      predictions.forEach(function (prediction, index) {
        const item = document.createElement('div')
        item.className = 'suggestion-item'
        item.innerHTML = `
            <div class="suggestion-name">${prediction.structured_formatting.main_text || ''}</div>
            <div class="suggestion-address">${prediction.description || ''}</div>
          `

        // 点击推荐项：触发地图跳转
        item.addEventListener('click', function () {
          selectSuggestion(prediction)
        })

        suggestionsList.appendChild(item)
      })

      // 显示推荐列表
      suggestionsContainer.style.display = 'block'
    }

    // 隐藏地址推荐下拉列表
    function hideSuggestions () {
      const suggestionsContainer = document.getElementById('searchSuggestions')
      if (suggestionsContainer) {
        suggestionsContainer.style.display = 'none'
      }
    }

    // 用户点击选择推荐地址项
    function selectSuggestion (prediction) {

      if (!prediction) return

      // 【修复】清除防抖定时器，防止选择后异步请求仍然返回结果
      if (searchTimer) {
        clearTimeout(searchTimer)
        searchTimer = null
      }

      // 隐藏推荐列表
      hideSuggestions()

      // 注意：不在这里更新搜索框，而是在 handleLocationSelected 中统一清空

      // 如果已经有 geometry 信息（来自 Geocoder），直接使用
      if (prediction.geometry && prediction.geometry.location) {
        // 使用 main_text 作为简短地址显示
        const shortAddress = prediction.structured_formatting?.main_text || prediction.description
        handleLocationSelected(prediction.geometry.location, shortAddress)
        return
      }

      // 否则使用 PlacesService 获取详细信息
      if (!prediction.place_id) {
        return
      }

      if (!map) {
        return
      }

      const placesService = new google.maps.places.PlacesService(map)
      placesService.getDetails(
        {
          placeId: prediction.place_id,
          fields: ['geometry', 'formatted_address', 'name']
        },
        function (place, status) {

          if (status === google.maps.places.PlacesServiceStatus.OK && place && place.geometry) {
            // 使用 place.name 作为简短地址
            handleLocationSelected(place.geometry.location, place.name || place.formatted_address || '')
          } else {
            // 兜底：使用 Geocoder
            if (geocoder) {
              geocoder.geocode({ address: prediction.description }, function (results, status) {
                if (status === google.maps.GeocoderStatus.OK && results && results[0]) {
                  // 从 formatted_address 提取简短地址（取第一个逗号前的部分）
                  const fullAddr = results[0].formatted_address || ''
                  const shortAddr = fullAddr.split(',')[0] || fullAddr
                  handleLocationSelected(results[0].geometry.location, shortAddr)
                }
              })
            }
          }
        }
      )
    }

    // 处理选中的地址（移动地图、显示标记、清空输入框）
    function handleLocationSelected (location, addressText) {
      if (!map || !location) return

      const lat = location.lat()
      const lng = location.lng()

      // 移动地图中心
      map.setCenter(location)
      map.setZoom(15)

      // 始终显示搜索位置标记（红色定位图标）
      showSearchMarker(location, addressText)

      // 隐藏推荐列表
      hideSuggestions()

      // 清空搜索框并让其失焦
      const searchInput = document.getElementById('searchInput')
      if (searchInput) {
        searchInput.value = ''
        searchInput.blur() // 让搜索框失去焦点
      }

      // 【新增】通知 map.vue 更新经纬度并重新请求数据
      // sendMessageToApp({
      //   type: 'searchLocationSelected',
      //   latitude: lat,
      //   longitude: lng,
      //   address: addressText
      // })

      // 隐藏团信息卡片（保留地图上所有团标记点）
      const groupCard = document.getElementById('groupCard')
      if (groupCard) groupCard.classList.add('hidden')

      // 清除所有标记点的高亮状态（但不删除标记点）
      markers.forEach((m) => {
        if (m.infoWindow) {
          m.infoWindow.close()
        }
        if (m.marker && typeof m.marker.setActive === 'function') {
          m.marker.setActive(false)
        }
      })

      // 注意：不发送searchLocationSelected消息给App
      // 用户可以自己在地图上滑动/缩放找到附近的团标记点后点击查看
    }

    // 处理搜索（地址 → 定位 → 显示附近团/地址）
    function handleSearch (keyword) {
      if (!keyword || !keyword.trim()) {
        // 清空搜索，恢复全部标记
        clearMarkers()
        if (window.mapMarkersData) {
          addMarkers(window.mapMarkersData)
          if (window.mapMarkersData[0]) {
            renderGroupCard(window.mapMarkersData[0])
          }
        }
        if (searchMarker) {
          searchMarker.setMap(null)
          searchMarker = null
        }
        return
      }

      if (!geocoder || !map) return

      geocoder.geocode({ address: keyword }, function (results, status) {
        if (
          status === google.maps.GeocoderStatus.OK &&
          results &&
          results[0]
        ) {
          const loc = results[0].geometry.location
          map.setCenter(loc)
          map.setZoom(20)

          const nearby = getNearbyGroups(loc, 50000)
          if (nearby.length) {
            clearMarkers()
            addMarkers(nearby)
            renderGroupCard(nearby[0])
            if (searchMarker) {
              searchMarker.setMap(null)
              searchMarker = null
            }
          } else {
            clearMarkers()
            if (searchMarker) {
              searchMarker.setMap(null)
              searchMarker = null
            }
            showSearchMarker(loc, results[0].formatted_address || keyword)
            // 隐藏团卡片（保留list-btn按钮）
            const groupCard = document.getElementById('groupCard')
            if (groupCard) groupCard.classList.add('hidden')

            // 清除所有标记点的高亮状态
            markers.forEach((m) => {
              if (m.infoWindow) {
                m.infoWindow.close()
              }
              if (m.marker && typeof m.marker.setActive === 'function') {
                m.marker.setActive(false)
              }
            })
          }
        } else {
          // geocode失败，保持现状
        }
      })
    }

    // ========== App通信与UI交互 ==========

    function sendMessageToApp (data) {
      try {
        // UniApp WebView 消息通信（按官方示例，不做字符串化）
        if (window.uni && typeof window.uni.postMessage === 'function') {
          window.uni.postMessage({ data })
          return
        }
        // iOS
        if (
          window.webkit &&
          window.webkit.messageHandlers &&
          window.webkit.messageHandlers.postMessage
        ) {
          window.webkit.messageHandlers.postMessage.postMessage(
            JSON.stringify(data),
          )
          return
        }
        // H5备用
        if (window.postMessage) {
          window.postMessage(JSON.stringify(data))
        }
      } catch (error) { }
    }

    // ========== Google Maps API 加载 ==========
    let loadRetryCount = 0
    const maxRetryCount = 3
    let loadTimeoutTimer = null

    // 动态加载Google Maps API脚本
    function loadGoogleMapsAPI (isRetry = false) {
      // 已加载成功时直接返回
      if ((window.google && window.google.maps) || googleMapsAPILoaded) {
        return
      }

      // 非重试情况下，如果正在加载则返回
      if (!isRetry && googleMapsScriptLoading) {
        return
      }

      // 重试时先清理旧的script标签
      if (isRetry) {
        const oldScript = document.getElementById('google-maps-script')
        if (oldScript) {
          oldScript.remove()
        }
      }

      // 如已有同名script且非重试，直接等它完成
      if (!isRetry && document.getElementById('google-maps-script')) {
        return
      }

      googleMapsScriptLoading = true
      const apiKey = 'AIzaSyBB9uJEdEC_Xug4IjPdI-MKLh9QNOrx9DA'
      const script = document.createElement('script')
      script.id = 'google-maps-script'
      // 只在重试时加 _t 破缓存；正常加载不加 → 让浏览器缓存 Maps SDK（省流量、首帧更快）
      script.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&libraries=geometry,places${isRetry ? '&_t=' + Date.now() : ''}`
      script.async = true
      script.defer = true

      // 清除之前的超时计时器
      if (loadTimeoutTimer) {
        clearTimeout(loadTimeoutTimer)
      }

      // 设置超时检测（15秒，缩短超时时间以便更快重试）
      loadTimeoutTimer = setTimeout(function () {
        if (!googleMapsAPILoaded) {
          googleMapsScriptLoading = false
          handleLoadFailure('加载超时')
        }
      }, 15000)

      script.onerror = function () {
        googleMapsScriptLoading = false
        if (loadTimeoutTimer) {
          clearTimeout(loadTimeoutTimer)
          loadTimeoutTimer = null
        }
        handleLoadFailure('网络错误')
      }

      script.onload = function () {
        googleMapsScriptLoading = false
        if (loadTimeoutTimer) {
          clearTimeout(loadTimeoutTimer)
          loadTimeoutTimer = null
        }
        loadRetryCount = 0 // 重置重试计数
        if (!mapInitialized) {
          initMap()
        }
      }

      document.head.appendChild(script)
    }

    // API加载失败处理（自动重试或显示重试按钮）
    function handleLoadFailure (reason) {
      loadRetryCount++

      if (loadRetryCount < maxRetryCount) {
        // 自动重试，间隔递增
        const retryDelay = loadRetryCount * 2000
        showLoadingWithRetry(
          '地图加载中(' +
          loadRetryCount +
          '/' +
          maxRetryCount +
          ')...',
        )
        setTimeout(function () {
          loadGoogleMapsAPI(true)
        }, retryDelay)
      } else {
        // 超过重试次数，显示手动重试按钮
        showErrorWithRetry('地图加载失败：' + reason)
        // 通知Vue加载失败
        sendMessageToApp({
          type: 'mapError',
          title: '地图加载失败',
          message: reason,
          canRetry: true,
        })
      }
    }

    // 显示带重试信息的加载状态
    function showLoadingWithRetry (message) {
      const loadingEl = document.getElementById('loading')
      const panelEl = document.getElementById('loadingPanel')
      if (panelEl) panelEl.style.display = 'none'
      if (loadingEl) {
        loadingEl.innerHTML = `
          <div class="spinner"></div>
          <div style="font-size: 15px; color: #fff;">${message}</div>
        `
        loadingEl.style.display = 'flex'
      }
    }

    // 显示带重试按钮的错误
    function showErrorWithRetry (message) {
      const loadingEl = document.getElementById('loading')
      const panelEl = document.getElementById('loadingPanel')
      if (loadingEl) loadingEl.style.display = 'none'
      if (panelEl) {
        panelEl.innerHTML = `
          <div class="panel-title">加载失败</div>
          <div class="panel-msg">${message}</div>
          <div class="panel-btn" onclick="retryLoadMap()">点击重试</div>
        `
        panelEl.style.display = 'flex'

    }

    // 手动重试加载
    function retryLoadMap () {
      loadRetryCount = 0
      showLoadingWithRetry('正在重新加载地图...')
      setTimeout(function () {
        loadGoogleMapsAPI(true)
      }, 500)
    }

    // 检测网络连接
    function checkNetworkConnection () {
      if (!navigator.onLine) {
        showErrorWithRetry('网络连接失败，请检查网络')
        return false
      }
      return true
    }

    // 页面加载完成后初始化
    window.onload = function () {
      // 检查网络连接
      if (!checkNetworkConnection()) {

      if (window.google && window.google.maps) {
        initMap()

      }
      // 立即开始加载，不再延迟（uni.webview.js是异步加载的，不需要等待）
      loadGoogleMapsAPI()

      }

    // 处理来自App的消息
    window.addEventListener('message', function (event) {
      // uni-app web-view 消息格式：event.data.data (1.5.4版本格式)
      let data = event.data

      // 如果是uni-app格式，提取实际数据
      if (data && data.data) {
        data = data.data
      }

      // 如果是字符串，尝试解析
      if (typeof data === 'string') {
        try {
          data = JSON.parse(data)
        } catch (error) {
          data = null
        }
      }

      if (!data || typeof data !== 'object') {
        return
      }

      switch (data.type) {
        case 'groupMarkers':
          // 接收来自Vue的所有团数据并添加标记点
          if (Array.isArray(data.groups) && data.groups.length > 0) {
            // 确保地图已初始化
            if (!map) {
              // 如果地图还没初始化，先保存数据，等地图ready后再添加
              window.mapMarkersData = data.groups
              return
            }
            addMarkers(data.groups)
            // 默认选中第一条，保证底部卡片有内容
            if (data.groups[0]) {
              renderGroupCard(data.groups[0])
            }
          }
          break
        case 'showGroup':
          if (data.group) {
            renderGroupCard(data.group)
          }
          break
        case 'updateCenter':
          if (map) {
            map.setCenter({
              lat: data.lat,
              lng: data.lng,
            })
            if (data.zoom) {
              map.setZoom(data.zoom)
            }
          }
          break
        case 'updateUserLocation':
          // 更新用户位置标记
          if (map && data.lat && data.lng) {
            // 先移除旧的用户位置标记
            if (userLocationMarker) {
              userLocationMarker.setMap(null)
              userLocationMarker = null
            }
            // 添加新的用户位置标记
            addUserLocationMarkerAt(data.lat, data.lng)
          }
          break
        case 'getUserLocation':
          const urlUserLat = parseFloat(getUrlParameter('userLat'))
          const urlUserLng = parseFloat(getUrlParameter('userLng'))
          sendMessageToApp({
            type: 'userLocation',
            lat: !isNaN(urlUserLat) ? urlUserLat : 34.70145,
            lng: !isNaN(urlUserLng) ? urlUserLng : 113.85013,
          })
          break
        case 'groupMarkers':
          // 接收来自Vue的所有团数据并添加标记点
          if (Array.isArray(data.groups) && data.groups.length > 0) {
            // 确保地图已初始化
            if (!map) {
              // 如果地图还没初始化，先保存数据，等地图ready后再添加
              window.mapMarkersData = data.groups
              return
            }
            addMarkers(data.groups)
            // 默认选中第一条，保证底部卡片有内容
            if (data.groups[0]) {
              renderGroupCard(data.groups[0])
            }
          }
          break
        case 'showGroup':
          if (data.group) {
            renderGroupCard(data.group)
          }
          break
        case 'markerClick':
          // 兜底：若uniapp把点击事件再回传H5，直接用回传的数据更新卡片
          if (data.group) {
            renderGroupCard(data.group)
            return
          }
          // 没带group时按id匹配现有标记数据
          if (data.markerId && Array.isArray(window.mapMarkersData)) {
            const found = window.mapMarkersData.find(
              (g) => String(g.id) === String(data.markerId),
            )
            if (found) {
              renderGroupCard(found)
            }
          }
          break
        case 'hideGroupCard':
          // 主动隐藏团信息卡片（保留list-btn按钮）
          const groupCard = document.getElementById('groupCard')
          if (groupCard) groupCard.classList.add('hidden')

          // 清除所有标记点的高亮状态
          markers.forEach((m) => {
            if (m.infoWindow) {
              m.infoWindow.close()
            }
            if (m.marker && typeof m.marker.setActive === 'function') {
              m.marker.setActive(false)
            }
          })

          currentGroupId = null
          break
        case 'setStatusBarHeight':
          if (data.height !== undefined) {
            document.documentElement.style.setProperty(
              '--status-bar-height',
              `${data.height}px`,
            )
            // CSS变量更新后，触发地图resize
            if (map) {
              setTimeout(function () {
                if (map) {
                  google.maps.event.trigger(map, 'resize')
                }
              }, 100)
            }
          }
          break
        case 'pageVisible':
          // 页面变为可见时，触发地图resize
          if (map) {
            setTimeout(function () {
              if (map) {
                google.maps.event.trigger(map, 'resize')
              }
            }, 200)
          }
          break
        default:
          break
      }
    })

    // UniApp环境下的初始化 - 关键：等待uni.webview.js加载完成
    document.addEventListener('UniAppJSBridgeReady', function () {
      uniWebViewReady = true
      initSafeArea()

      // 如果Google Maps API还未加载，现在加载
      if (!googleMapsAPILoaded && !window.google) {
        if (checkNetworkConnection()) {
          loadGoogleMapsAPI()
        }
      }

      // 注意：这里不发送mapReady，mapReady只在doInitMap完成后发送
      // 这里只是通知UniApp的JSBridge已准备好
    })

    // 兜底：如果UniAppJSBridgeReady事件未触发，在DOMContentLoaded后检查
    document.addEventListener('DOMContentLoaded', function () {
      // 再次检查uni.webview.js
      setTimeout(function () {
        if (!uniWebViewReady) {
          checkUniWebViewReady()
        }
      }, 500)
    })

    // 页面可见性变化处理（解决web-view切换时的白屏问题）
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && map && mapInitialized) {
        setTimeout(function () {
          if (map) {
            google.maps.event.trigger(map, 'resize')
          }
        }, 200)
      }
    })
  </script>
</body>

</html>
